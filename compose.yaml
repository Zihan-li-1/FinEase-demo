name: finease-local-check
services:
  web:
    image: finease-docker-test:local
    build:
      context: .
      target: runtime
      args:
        FINEASE_GIT_SHA: ${FINEASE_GIT_SHA:-unknown}
        FINEASE_GIT_DIRTY: ${FINEASE_GIT_DIRTY:-unknown}
    init: true
    ports:
      - "127.0.0.1:4300:3000"
    environment:
      FINEASE_ACCESS_CODE: ${FINEASE_ACCESS_CODE:?Use --env-file .env.local}
      CONTINUATION_TOKEN_SECRET: ${CONTINUATION_TOKEN_SECRET:?Use --env-file .env.local}
      FINEASE_TRUEFORGE_BILL_ENABLED: "true"
      FINEASE_TRUEFORGE_READ_ENABLED: "true"
      FINEASE_TRUEFORGE_TRANSFER_ENABLED: "true"
      FINEASE_TRUEFORGE_CARD_PREVIEW_ENABLED: "true"
      TRUEFORGE_BASE_URL: http://host.docker.internal:8790
      TRUEFORGE_MODEL: ${TRUEFORGE_MODEL:-test/deepseek-v4-1-flash}
      TRUEFORGE_TOKEN: ${TRUEFORGE_TOKEN:-}
      TRUEFORGE_MCP_SERVER: finease-docker-mcp
      TRUEFORGE_SKILL_MCP_SERVER: finease-docker-bridge
      FINEASE_TRUEFORGE_AUDIT_FILE: /tmp/trueforge-audit.jsonl
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      QWEN_MODEL: ${QWEN_MODEL:-qwen-plus}
      QWEN_BASE_URL: ${QWEN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      DATABASE_URL: ""
      ALLOW_EPHEMERAL_BANKING: "true"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  mcp:
    image: finease-docker-test:local
    command: [node, server/mcp/finease-trial.mjs]
    init: true
    ports:
      - "127.0.0.1:4333:3333"
    environment:
      FINEASE_MCP_HOST: 0.0.0.0
      CONTINUATION_TOKEN_SECRET: ${CONTINUATION_TOKEN_SECRET:?Use --env-file .env.local}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3333/mcp').then(r=>process.exit(r.status===405?0:1)).catch(()=>process.exit(1))"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  bridge:
    image: finease-docker-test:local
    command: [node, server/mcp/trueforge-token-bridge.mjs]
    init: true
    ports:
      - "127.0.0.1:4334:3334"
    environment:
      FINEASE_BRIDGE_HOST: 0.0.0.0
      FINEASE_BRIDGE_UPSTREAM_URL: http://mcp:3333/mcp
    depends_on:
      mcp:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3334/mcp').then(r=>process.exit(r.status===405?0:1)).catch(()=>process.exit(1))"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  test-db:
    image: postgres:17-bookworm
    profiles: [test]
    environment:
      POSTGRES_USER: finease_test
      POSTGRES_PASSWORD: local-isolated-test-only
      POSTGRES_DB: finease_test
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U finease_test -d finease_test"]
      interval: 3s
      timeout: 3s
      retries: 10
  tests:
    image: finease-docker-tests:local
    profiles: [test]
    build:
      context: .
      target: test
    depends_on:
      test-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://finease_test:local-isolated-test-only@test-db:5432/finease_test
      BANKING_TEST_DATABASE_URL: postgresql://finease_test:local-isolated-test-only@test-db:5432/finease_test
    command: [sh, -c, "npm run db:migrate && npm test && npm run lint && npx next typegen && npm run typecheck"]
